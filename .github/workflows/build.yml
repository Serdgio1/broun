name: Build Windows Executable

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pygame pygame_gui numpy pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller main.spec
    
    - name: Create ZIP archive
      run: |
        Compress-Archive -Path dist\particle_simulation\* -DestinationPath particle_simulation_windows.zip -Force
    
    - name: Upload Windows executable
      uses: actions/upload-artifact@v3
      with:
        name: particle-simulation-windows
        path: particle_simulation_windows.zip
    
    - name: Create Release (if tag)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: particle_simulation_windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
