name: Build Windows Executable

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pygame pygame_gui numpy pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller main.spec
        if (-not (Test-Path "dist\particle_simulation.exe")) {
          Write-Error "Executable not found!"
          exit 1
        }
        Write-Host "Executable size: $((Get-Item 'dist\particle_simulation.exe').Length / 1MB) MB"
    
    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: particle-simulation-windows
        path: dist/particle_simulation.exe
        retention-days: 30
    
    - name: Create Release (if tag)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: dist/particle_simulation.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
